<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | XenProperty</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong>XenProperty Admin</strong><button id="logoutBtn">Logout</button></header>
<main><h1>Property Verification</h1><p class="muted">Review seller submissions before publishing them on the public website.</p>
<section class="stats"><button class="stat-card active" data-report="pending"><b id="pendingCount">0</b><span>Pending</span><small>View pending report</small></button><button class="stat-card" data-report="published"><b id="approvedCount">0</b><span>Published</span><small>View published report</small></button><button class="stat-card" data-report="users"><b id="usersCount">0</b><span>Users</span><small>View users report</small></button></section>
<section class="card"><h2 id="reportTitle">Pending Submissions Report</h2><div class="report-tabs"><button data-report="pending" class="active">Pending</button><button data-report="published">Published</button><button data-report="users">Users</button></div><div class="table-wrap"><table id="reportTable"><thead id="reportHead"></thead><tbody id="reportRows"><tr><td>Loading...</td></tr></tbody></table></div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="firestore.js"></script><script src="app.js"></script>
</body></html>
