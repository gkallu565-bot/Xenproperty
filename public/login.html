<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login or Register | XenProperty AI Ecosystem</title>
  <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261105-2">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <img src="images/logo.png" alt="XenProperty - Where Dreams Your Home..." class="brand-logo-img">
      </a>
      <ul class="nav-links">
        <li><a href="buy.html" class="nav-link">Buy</a></li>
        <li><a href="rent.html" class="nav-link">Rent</a></li>
        <li><a href="sell.html" class="nav-link">Sell</a></li>
        <li class="nav-dropdown">
          <a href="services.html" class="nav-link" aria-haspopup="true">Services <i class="fa-solid fa-chevron-down nav-dropdown-icon" aria-hidden="true"></i></a>
          <ul class="nav-dropdown-menu" aria-label="Services options">
            <li><a href="design.html">Design</a></li>
            <li><a href="house-plans.html">House Plans</a></li>
            <li><a href="loans.html">Home Loans</a></li>
          </ul>
        </li>
      </ul>
      <div class="nav-actions" id="navbarAuthArea">
        <a href="sell.html" class="btn-list-prop" onclick="goListProperty(event)"><i class="fa-solid fa-plus"></i> List Property</a>
      </div>
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Open navigation menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <main class="container" style="padding: 60px 24px;">
    <div style="max-width:480px; margin: 0 auto; background:#ffffff; border:1px solid #e5ebe7; border-radius:var(--radius-xl); padding:36px; box-shadow:var(--shadow-lg);">
      <!-- TABS -->
      <div class="search-tabs" style="display:flex; width:100%; margin-bottom:24px;">
        <button type="button" id="tabLoginBtn" class="search-tab-btn active" style="flex:1; text-align:center;" onclick="switchAuthTab('login')">
          Sign In
        </button>
        <button type="button" id="tabSignupBtn" class="search-tab-btn" style="flex:1; text-align:center;" onclick="switchAuthTab('signup')">
          Create Account
        </button>
      </div>

      <div style="margin-bottom:22px;">
        <label style="display:block; margin-bottom:8px; font-weight:700; color:#23443b;">Login as</label>
        <div style="display:flex; gap:8px; background:#f1f5f3; padding:5px; border-radius:12px;">
          <button type="button" id="buyerTypeBtn" onclick="selectAccountType('buyer')" style="flex:1; border:0; border-radius:9px; padding:11px 8px; background:#075743; color:#fff; font-weight:700; cursor:pointer;">Buyer / Tenant</button>
          <button type="button" id="sellerTypeBtn" onclick="selectAccountType('seller')" style="flex:1; border:0; border-radius:9px; padding:11px 8px; background:transparent; color:#36564d; font-weight:700; cursor:pointer;">Seller / Owner</button>
        </div>
        <input type="hidden" id="accountType" value="buyer">
      </div>

      <!-- LOGIN FORM -->
      <div id="loginSection">
        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" required class="form-control" placeholder="user@domain.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" required class="form-control" placeholder="Enter password">
          </div>
          <button type="submit" id="loginSubmitBtn" class="btn-submit-primary" style="margin-top:10px;">
            Sign In to XenProperty
          </button>
        </form>
      </div>

      <!-- SIGN UP FORM -->
      <div id="signupSection" style="display:none;">
        <form id="registerForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" required class="form-control" placeholder="Rahul Sharma">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" required class="form-control" placeholder="rahul@domain.com">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="regPhone" required class="form-control" placeholder="+91 98765 43210">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" required class="form-control" placeholder="Minimum 6 characters">
          </div>
          <button type="submit" id="registerSubmitBtn" class="btn-submit-primary" style="margin-top:10px;">
            Create Account
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 XenProperty Technologies India Pvt. Ltd. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="js/matcher.js"></script>


  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="js/firebase-config.js?v=20261103-2"></script><script src="js/firestore-direct.js?v=20261102-4"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js?v=20261105-2"></script>
  <script src="js/auth.js?v=20261103-10"></script>
</body>
</html>
