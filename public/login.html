<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login or Register | XenProperty AI Ecosystem</title>
  <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <img src="images/logo.png" alt="XenProperty - Where Dreams Your Home..." class="brand-logo-img">
      </a>
      <ul class="nav-links">
        <li><a href="buy.html" class="nav-link">Buy</a></li>
        <li><a href="rent.html" class="nav-link">Rent</a></li>
        <li><a href="sell.html" class="nav-link">Sell</a></li>
        <li><a href="design.html" class="nav-link">Design</a></li>
        <li><a href="loans.html" class="nav-link">Home Loans</a></li>
      </ul>
      <div class="nav-actions">
        <a href="sell.html" class="btn-list-prop" onclick="goListProperty(event)"><i class="fa-solid fa-plus"></i> List Property</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 60px 24px;">
    <div style="max-width:480px; margin: 0 auto; background:#ffffff; border:1px solid #e5ebe7; border-radius:var(--radius-xl); padding:36px; box-shadow:var(--shadow-lg);">
      <!-- TABS -->
      <div class="search-tabs" style="display:flex; width:100%; margin-bottom:24px;">
        <button type="button" id="tabLoginBtn" class="search-tab-btn active" style="flex:1; text-align:center;" onclick="switchAuthTab('login')">
          Sign In
        </button>
        <button type="button" id="tabSignupBtn" class="search-tab-btn" style="flex:1; text-align:center;" onclick="switchAuthTab('signup')">
          Create Account
        </button>
      </div>

      <!-- Quick Demo Logins -->
      <div style="background:#f1f7f4; border:1px solid #cce8de; border-radius:12px; padding:12px 16px; margin-bottom:20px; font-size:0.82rem;">
        <div style="font-weight:700; color:var(--primary); margin-bottom:6px;">
          <i class="fa-solid fa-key"></i> 1-Click Demo Login:
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button type="button" onclick="demoLoginAsUser()" style="background:#ffffff; border:1px solid #b9d7cb; padding:6px 14px; border-radius:8px; font-size:0.8rem; font-weight:700; cursor:pointer;">
            <i class="fa-solid fa-user"></i> Login as Demo User
          </button>
          <button type="button" onclick="demoLoginAsAdmin()" style="background:#ffffff; border:1px solid #ea580c; color:#ea580c; padding:6px 14px; border-radius:8px; font-size:0.8rem; font-weight:700; cursor:pointer;">
            <i class="fa-solid fa-shield-halved"></i> Login as Demo Admin
          </button>
        </div>
        <div style="font-size:0.74rem; color:#6b7280; margin-top:8px;">
          Signs you in straight away and opens the home page.
        </div>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginSection">
        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" required class="form-control" placeholder="user@domain.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" required class="form-control" placeholder="Enter password">
          </div>
          <button type="submit" id="loginSubmitBtn" class="btn-submit-primary" style="margin-top:10px;">
            Sign In to XenProperty
          </button>
        </form>
      </div>

      <!-- SIGN UP FORM -->
      <div id="signupSection" style="display:none;">
        <form id="registerForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" required class="form-control" placeholder="Rahul Sharma">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" required class="form-control" placeholder="rahul@domain.com">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="regPhone" required class="form-control" placeholder="+91 98765 43210">
          </div>
          <div class="form-group">
            <label>Account Role</label>
            <select id="regRole" class="form-control" aria-label="Account role">
              <option value="user">Buyer / Tenant</option>
              <option value="agent">Property Owner / Broker</option>
            </select>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" required class="form-control" placeholder="Minimum 6 characters">
          </div>
          <button type="submit" id="registerSubmitBtn" class="btn-submit-primary" style="margin-top:10px;">
            Create Account
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 XenProperty Technologies India Pvt. Ltd. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="js/matcher.js"></script>

  <script src="js/demo-store.js"></script>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
